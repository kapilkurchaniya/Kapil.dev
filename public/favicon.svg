<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050713"/>
      <stop offset="100%" stop-color="#0c1029"/>
    </linearGradient>
    <!-- K letter gradient (cyan spectrum) -->
    <linearGradient id="kGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="50%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.2" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.4
                0 0 0 0 0.91
                0 0 0 0 0.98
                0 0 0 0.55 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Subtle corner accent -->
    <radialGradient id="accent" cx="0.85" cy="0.15" r="0.55">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>

  <!-- Subtle ambient accent glow in corner -->
  <rect width="64" height="64" rx="16" fill="url(#accent)"/>

  <!-- Fine border for depth -->
  <rect x="0.5" y="0.5" width="63" height="63" rx="15.5" fill="none" stroke="#67e8f9" stroke-opacity="0.15"/>

  <!-- K letterform with gradient + glow -->
  <g filter="url(#glow)">
    <path
      d="M18 14h9v14.5L40.5 14H51L36 31.5 52 50H41L27 35.5V50H18V14Z"
      fill="url(#kGrad)"
    />
  </g>

  <!-- Accent dot -->
  <circle cx="52" cy="12" r="2.5" fill="#67e8f9" opacity="0.7"/>
</svg>
